<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Styling · tree-element example</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/pages/styling.css" />
  </head>
  <body>
    <!-- header -->
    <main>
      <p>
        Custom folder icons, extra markup per node from <code>onCreateLi</code>,
        colors from css custom properties, and css that overrides the default
        stylesheet. The options below recreate the tree, keeping its open and
        selected nodes; the dark theme only changes the colors.
      </p>
      <div class="layout">
        <section class="panel">
          <h2>Tree</h2>
          <div id="tree" class="tree fancy"></div>
        </section>
        <section class="panel">
          <h2>Options</h2>
          <div
            class="toolbar"
            style="flex-direction: column; align-items: start"
          >
            <label
              ><input id="rtl" type="checkbox" /> <code>rtl</code>: right to
              left</label
            >
            <label
              ><input id="button-right" type="checkbox" />
              <code>buttonLeft: false</code>: toggler after the title</label
            >
            <label
              ><input id="no-slide" type="checkbox" />
              <code>slide: false</code>: no animation</label
            >
            <label
              ><input id="show-notes" type="checkbox" checked /> Show notes,
              periods and counts (<code>onCreateLi</code>)</label
            >
            <label
              ><input id="dark" type="checkbox" /> Dark theme: other values for
              the css custom properties</label
            >
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/pages/styling.ts"></script>
  </body>
</html>
